<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 200 200" width="200" height="200" onload="alert('onload')">
  <title>Malicious SVG fixture</title>
  <script type="text/javascript">alert('script')</script>
  <style>
    .evil { background: url(https://evil.example/pixel.png); }
    @import url("https://evil.example/x.css");
  </style>
  <foreignObject x="0" y="0" width="100" height="100">
    <div xmlns="http://www.w3.org/1999/xhtml">foreign content</div>
  </foreignObject>
  <image id="external-image" href="https://evil.example/tracker.png" xlink:href="https://evil.example/tracker.png" x="0" y="0" width="50" height="50"/>
  <a id="link" href="javascript:alert(1)" xlink:href="javascript:alert(2)">
    <rect id="link-target" x="10" y="10" width="40" height="40" fill="#FF0000"/>
  </a>
  <rect id="attack-rect" x="90" y="90" width="40" height="40" fill="#FF0000" onload="alert('rect-onload')" onclick="alert('click')"/>
  <rect id="safe-rect" x="140" y="90" width="50" height="50" fill="#2B4BF2"/>
  <path id="safe-path" d="M20 180 L180 180" fill="none" stroke="#17151F" stroke-width="4"/>
</svg>
